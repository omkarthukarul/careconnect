name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android Platform Scaffolding
        run: |
          rm -rf android
          cp -r lib lib_backup
          flutter create . --platforms=android --org com.careconnect
          rm -rf lib
          mv lib_backup lib

          # Inject permissions into AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml

          # Ensure minSdk is 21 for flutter_secure_storage
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
          echo "=== VERIFY APK ARTIFACT ==="
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CareConnect-Maharashtra-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "CareConnect Maharashtra v1.0.0 (SIH Release APK)"
          body: |
            ### 🏥 संजीवन महा-नेट (CareConnect Maharashtra)
            **Tagline:** "From first contact to completed care."
            
            Smart India Hackathon 2024/2025 HealthTech Mobile Application.
            
            #### 📱 Android Installation:
            Download `app-release.apk` below directly onto your Android device and install it.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
