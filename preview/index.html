<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>संजीवन महा-नेट — CareConnect Maharashtra Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif;
    }
    .status-emergency { background-color: #FEE2E2; color: #EF4444; border: 1px solid #FCA5A5; }
    .status-urgent { background-color: #FEF3C7; color: #D97706; border: 1px solid #FCD34D; }
    .status-available { background-color: #D1FAE5; color: #059669; border: 1px solid #6EE7B7; }
    .status-in-progress { background-color: #DBEAFE; color: #2563EB; border: 1px solid #93C5FD; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- Header Banner -->
  <div class="text-center mb-4">
    <div class="inline-flex items-center gap-2 bg-teal-500/20 text-teal-300 px-3 py-1 rounded-full text-xs font-bold border border-teal-500/30 mb-2">
      <span>🏥</span> Smart India Hackathon HealthTech Prototype
    </div>
    <h1 class="text-2xl font-black text-white">संजीवन महा-नेट (CareConnect Maharashtra)</h1>
    <p class="text-xs text-slate-400 italic">“From first contact to completed care.”</p>
  </div>

  <!-- Mobile Frame Container -->
  <div class="w-full max-w-md bg-slate-50 text-slate-800 rounded-3xl shadow-2xl overflow-hidden border-4 border-slate-700 flex flex-col h-[820px] relative">
    
    <!-- Status Bar -->
    <div class="bg-[#0B2545] text-white px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold">
      <span>12:15 PM</span>
      <div class="flex items-center gap-2">
        <span class="bg-teal-500/30 text-teal-300 px-2 py-0.5 rounded text-[10px] font-bold">5G • PHC PUNE</span>
        <button id="langToggle" onclick="toggleLang()" class="bg-white/20 hover:bg-white/30 text-white px-2 py-0.5 rounded-full text-[11px] font-bold transition">
          मराठी / EN
        </button>
      </div>
    </div>

    <!-- App Bar -->
    <div class="bg-[#0B2545] text-white px-5 py-3 shadow-md flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-teal-600 flex items-center justify-center text-white font-black text-lg shadow-inner">
          +
        </div>
        <div>
          <h1 id="barTitle" class="text-base font-extrabold tracking-tight leading-none text-white">संजीवन महा-नेट</h1>
          <p id="barSubtitle" class="text-[11px] text-teal-300 font-medium leading-tight mt-0.5">CareConnect Maharashtra</p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="navigate('profile')" class="p-1.5 hover:bg-white/10 rounded-full text-slate-300">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </button>
      </div>
    </div>

    <!-- SCREEN CONTAINER -->
    <div id="screenContent" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
      <!-- Injected by JavaScript -->
    </div>

    <!-- Bottom Navigation (Medical Officer Mode) -->
    <div id="bottomNav" class="bg-white border-t border-slate-200 px-3 py-2 flex justify-around items-center text-xs font-semibold text-slate-500 shadow-lg">
      <button onclick="navigate('dashboard')" class="flex flex-col items-center gap-1 text-teal-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        <span id="navHome">Dashboard</span>
      </button>
      <button onclick="navigate('register')" class="flex flex-col items-center gap-1 hover:text-teal-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        <span id="navRegister">Register</span>
      </button>
      <button onclick="navigate('triage')" class="flex flex-col items-center gap-1 hover:text-teal-700">
        <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        <span id="navTriage">Triage</span>
      </button>
      <button onclick="navigate('facilities')" class="flex flex-col items-center gap-1 hover:text-teal-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        <span id="navBeds">Beds</span>
      </button>
      <button onclick="navigate('referrals')" class="flex flex-col items-center gap-1 hover:text-teal-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span id="navTrack">Track</span>
      </button>
    </div>

  </div>

  <script>
    let currentLang = 'en';
    let currentScreen = 'dashboard';
    let activePatient = {
      id: 'MH-PUN-2026-0842',
      name: 'Ramesh Balasaheb Patil',
      age: 58,
      gender: 'Male',
      village: 'Shikrapur, Pune',
      abha: '91-4920-1849-2041'
    };
    let triageResult = {
      urgency: 'EMERGENCY',
      color: '#EF4444',
      recommendation: 'Immediate transfer to Tertiary ICCU via 108 ALS Ambulance.',
      riskFactors: [
        'Critical Hypoxia: SpO₂ 88% (< 90%)',
        'Severe Tachycardia: Heart Rate 126 bpm',
        'Suspected Acute Coronary Syndrome (ACS)'
      ]
    };
    let referralStatus = 'IN TRANSIT';
    let bedLockId = 'BED-ICU-B04';

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'mr' : 'en';
      document.getElementById('langToggle').innerText = currentLang === 'en' ? 'मराठी / EN' : 'English / MR';
      updateNavLabels();
      renderScreen();
    }

    function updateNavLabels() {
      if (currentLang === 'mr') {
        document.getElementById('navHome').innerText = 'डॅशबोर्ड';
        document.getElementById('navRegister').innerText = 'नोंदणी';
        document.getElementById('navTriage').innerText = 'तपासणी';
        document.getElementById('navBeds').innerText = 'खाटा';
        document.getElementById('navTrack').innerText = 'ट्रॅक';
      } else {
        document.getElementById('navHome').innerText = 'Dashboard';
        document.getElementById('navRegister').innerText = 'Register';
        document.getElementById('navTriage').innerText = 'Triage';
        document.getElementById('navBeds').innerText = 'Beds';
        document.getElementById('navTrack').innerText = 'Track';
      }
    }

    function navigate(screen) {
      currentScreen = screen;
      renderScreen();
    }

    function renderScreen() {
      const container = document.getElementById('screenContent');
      if (currentScreen === 'dashboard') {
        container.innerHTML = `
          <div onclick="navigate('referrals')" class="cursor-pointer bg-red-500 text-white p-3 rounded-xl flex items-center gap-3 shadow-md hover:bg-red-600 transition">
            <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center font-bold text-lg animate-pulse">⚠️</div>
            <div class="flex-1">
              <p class="font-extrabold text-xs tracking-wider">${currentLang === 'mr' ? '२ तातडीची प्रकरणे सक्रिय' : '2 ACTIVE EMERGENCY CASES'}</p>
              <p class="text-[11px] text-red-100">${currentLang === 'mr' ? 'तातडीने खाट आरक्षण आणि रुग्णवाहिका आवश्यक' : 'Critical hypoxia referral requiring immediate ICU lock'}</p>
            </div>
            <span>→</span>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
              <span class="text-teal-600 font-bold text-xs">${currentLang === 'mr' ? 'सक्रिय रुग्ण' : 'Active Patients'}</span>
              <p class="text-2xl font-black text-slate-800 mt-1">24</p>
              <span class="text-[10px] text-slate-400 font-semibold">Shirur PHC Unit</span>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
              <span class="text-amber-600 font-bold text-xs">${currentLang === 'mr' ? 'प्रलंबित संदर्भ' : 'Pending Referrals'}</span>
              <p class="text-2xl font-black text-slate-800 mt-1">6</p>
              <span class="text-[10px] text-amber-500 font-semibold">Awaiting Bed</span>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
              <span class="text-red-600 font-bold text-xs">${currentLang === 'mr' ? 'आपत्कालीन' : 'Emergency Cases'}</span>
              <p class="text-2xl font-black text-red-600 mt-1">3</p>
              <span class="text-[10px] text-red-400 font-semibold">108 ALS Ready</span>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
              <span class="text-blue-600 font-bold text-xs">${currentLang === 'mr' ? 'उपलब्ध रुग्णालये' : 'Available Facilities'}</span>
              <p class="text-2xl font-black text-slate-800 mt-1">14</p>
              <span class="text-[10px] text-emerald-500 font-semibold">Live Network</span>
            </div>
          </div>

          <div>
            <h3 class="font-bold text-sm text-slate-700 mb-2">${currentLang === 'mr' ? 'जलद कृती' : 'Quick Actions'}</h3>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="navigate('register')" class="bg-teal-700 hover:bg-teal-800 text-white p-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm transition">
                <span>➕</span> ${currentLang === 'mr' ? 'रुग्ण नोंदणी' : 'Register Patient'}
              </button>
              <button onclick="navigate('triage')" class="bg-[#0B2545] hover:bg-[#134074] text-white p-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm transition">
                <span>⚡</span> ${currentLang === 'mr' ? 'नवीन तपासणी' : 'New Triage'}
              </button>
              <button onclick="navigate('facilities')" class="bg-white hover:bg-slate-50 text-slate-800 border border-slate-200 p-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm transition">
                <span>🏥</span> ${currentLang === 'mr' ? 'रुग्णालय शोधा' : 'Find Facility'}
              </button>
              <button onclick="navigate('ambulance')" class="bg-white hover:bg-slate-50 text-slate-800 border border-slate-200 p-3 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm transition">
                <span>🚑</span> ${currentLang === 'mr' ? '१०८ रुग्णवाहिका' : 'EMS Tracking'}
              </button>
            </div>
          </div>

          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] font-bold bg-red-100 text-red-600 px-2 py-0.5 rounded-full">LIVE EMERGENCY</span>
                <h4 class="font-bold text-slate-800 mt-1">${activePatient.name}</h4>
                <p class="text-xs text-slate-500">${activePatient.age}y • ${activePatient.gender} • ${activePatient.id}</p>
              </div>
              <button onclick="navigate('referrals')" class="text-xs font-bold text-teal-700 underline">Track</button>
            </div>
            <div class="mt-3 bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-xs">
              <p class="text-slate-600"><strong>Destination:</strong> District Hospital Pune (ICU)</p>
              <p class="text-slate-600"><strong>Ambulance:</strong> MH-12-EM-1081 (Pilot Sambhaji) • ETA 18 min</p>
            </div>
          </div>
        `;
      } else if (currentScreen === 'register') {
        container.innerHTML = `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center">
              <h3 class="font-bold text-base text-slate-800">${currentLang === 'mr' ? 'नवीन रुग्ण नोंदणी' : 'Patient Registration'}</h3>
              <button onclick="fillDemoPatient()" class="text-xs text-teal-700 bg-teal-50 border border-teal-200 px-2 py-1 rounded-md font-bold">Auto-Fill Demo</button>
            </div>
            <div>
              <label class="text-xs font-bold text-slate-600">Full Name *</label>
              <input id="regName" type="text" value="${activePatient.name}" class="w-full text-xs p-2.5 border rounded-lg mt-1 font-semibold">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-bold text-slate-600">Age *</label>
                <input id="regAge" type="number" value="${activePatient.age}" class="w-full text-xs p-2.5 border rounded-lg mt-1">
              </div>
              <div>
                <label class="text-xs font-bold text-slate-600">Gender *</label>
                <select id="regGender" class="w-full text-xs p-2.5 border rounded-lg mt-1">
                  <option>Male</option><option>Female</option><option>Other</option>
                </select>
              </div>
            </div>
            <div>
              <label class="text-xs font-bold text-slate-600">Mobile Number *</label>
              <input type="text" value="9822019485" class="w-full text-xs p-2.5 border rounded-lg mt-1">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-bold text-slate-600">Village/Town *</label>
                <input type="text" value="Shikrapur" class="w-full text-xs p-2.5 border rounded-lg mt-1">
              </div>
              <div>
                <label class="text-xs font-bold text-slate-600">District *</label>
                <input type="text" value="Pune" class="w-full text-xs p-2.5 border rounded-lg mt-1 font-semibold" readonly>
              </div>
            </div>
            <div>
              <label class="text-xs font-bold text-slate-600">ABHA Health ID (Optional)</label>
              <input type="text" value="${activePatient.abha}" class="w-full text-xs p-2.5 border rounded-lg mt-1 text-teal-700 font-bold">
            </div>
            <button onclick="navigate('triage')" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold p-3 rounded-xl text-xs mt-2 transition">
              ${currentLang === 'mr' ? 'रुग्ण नोंदणी करा आणि तपासणी सुरू करा' : 'REGISTER & PROCEED TO CLINICAL INTAKE'}
            </button>
          </div>
        `;
      } else if (currentScreen === 'triage') {
        container.innerHTML = `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
              <div>
                <h3 class="font-bold text-sm text-slate-800">${activePatient.name}</h3>
                <span class="text-[10px] text-slate-500">${activePatient.id} • ${activePatient.age}y ${activePatient.gender}</span>
              </div>
              <span class="bg-teal-100 text-teal-800 text-[10px] font-extrabold px-2 py-0.5 rounded">INTAKE ACTIVE</span>
            </div>

            <div>
              <span class="text-[10px] font-bold text-slate-400">SIH SCENARIO PRESETS</span>
              <div class="flex gap-1.5 mt-1 overflow-x-auto pb-1">
                <button onclick="applyPreset('hypoxia')" class="text-[10px] bg-red-100 text-red-700 border border-red-200 font-bold px-2 py-1 rounded whitespace-nowrap">Critical Hypoxia</button>
                <button onclick="applyPreset('stemi')" class="text-[10px] bg-red-100 text-red-700 border border-red-200 font-bold px-2 py-1 rounded whitespace-nowrap">Acute STEMI</button>
                <button onclick="applyPreset('routine')" class="text-[10px] bg-emerald-100 text-emerald-700 border border-emerald-200 font-bold px-2 py-1 rounded whitespace-nowrap">Stable Routine</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="p-2 border rounded-lg bg-slate-50">
                <span class="text-slate-500 font-semibold">SpO₂ (%)</span>
                <input id="vSpo2" type="number" value="88" class="w-full text-base font-extrabold text-red-600 bg-transparent">
              </div>
              <div class="p-2 border rounded-lg bg-slate-50">
                <span class="text-slate-500 font-semibold">Heart Rate (BPM)</span>
                <input id="vHr" type="number" value="126" class="w-full text-base font-extrabold text-red-600 bg-transparent">
              </div>
              <div class="p-2 border rounded-lg bg-slate-50">
                <span class="text-slate-500 font-semibold">BP (Systolic)</span>
                <input id="vBp" type="number" value="175" class="w-full text-base font-extrabold text-slate-800 bg-transparent">
              </div>
              <div class="p-2 border rounded-lg bg-slate-50">
                <span class="text-slate-500 font-semibold">Resp. Rate (/min)</span>
                <input id="vRr" type="number" value="26" class="w-full text-base font-extrabold text-slate-800 bg-transparent">
              </div>
            </div>

            <div>
              <label class="text-xs font-bold text-slate-600">Consciousness Level (AVPU)</label>
              <select id="vAvpu" class="w-full text-xs p-2 border rounded-lg mt-1 font-semibold">
                <option value="alert">Alert (जागृत)</option>
                <option value="verbal">Responds to Voice</option>
                <option value="pain">Responds to Pain</option>
                <option value="unresponsive">Unresponsive</option>
              </select>
            </div>

            <button onclick="calculateTriage()" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold p-3 rounded-xl text-xs shadow-lg transition">
              ⚡ ${currentLang === 'mr' ? 'तपासणी सुरू करा (RUN TRIAGE)' : 'RUN CLINICAL DECISION TRIAGE'}
            </button>
          </div>
        `;
      } else if (currentScreen === 'triage_result') {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border-2 border-red-500 p-4 shadow-xl space-y-3">
            <div class="bg-red-50 border border-red-200 p-3 rounded-xl flex items-center justify-between">
              <div>
                <span class="text-[10px] font-black tracking-widest text-red-600">DECISION SUPPORT LEVEL</span>
                <h2 class="text-2xl font-black text-red-600">${triageResult.urgency}</h2>
              </div>
              <span class="bg-red-600 text-white font-bold text-xs px-3 py-1 rounded-full">${currentLang === 'mr' ? 'आपत्कालीन' : 'RED CODE'}</span>
            </div>

            <div>
              <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Identified Risk Factors:</h4>
              <ul class="text-xs space-y-1.5 mt-1 text-slate-800">
                ${triageResult.riskFactors.map(r => `<li class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>${r}</li>`).join('')}
              </ul>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
              <span class="text-[10px] font-bold text-slate-500 uppercase">Recommended Immediate Referral</span>
              <p class="text-xs font-bold text-slate-800 mt-1">${triageResult.recommendation}</p>
            </div>

            <div class="p-2 bg-slate-100 rounded text-[10px] text-slate-500 italic">
              Decision-support prototype: NOT an autonomous medical diagnosis machine.
            </div>

            <button onclick="navigate('facilities')" class="w-full bg-teal-700 hover:bg-teal-800 text-white font-extrabold p-3 rounded-xl text-xs shadow-md transition">
              🔍 ${currentLang === 'mr' ? 'सर्वोत्तम रुग्णालये शोधा' : 'FIND BEST MATCHED HOSPITALS'}
            </button>
          </div>
        `;
      } else if (currentScreen === 'facilities') {
        container.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <h3 class="font-extrabold text-sm text-slate-800">${currentLang === 'mr' ? 'सर्वोत्तम रुग्णालये' : 'BEST FACILITIES FOR THIS PATIENT'}</h3>
            <span class="text-[10px] bg-teal-100 text-teal-800 font-bold px-2 py-0.5 rounded">ICU Matched</span>
          </div>

          <div class="bg-white p-4 rounded-xl border-2 border-teal-600 shadow-sm space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="font-bold text-sm text-slate-800">District Hospital Pune (Aundh)</h4>

              </div>
              <span class="bg-emerald-100 text-emerald-800 text-[10px] font-black px-2 py-0.5 rounded">AVAILABLE</span>
            </div>

              <div class="bg-emerald-50 border border-emerald-200 p-1.5 rounded-lg">

                <span class="text-[9px] text-slate-500 font-bold">ICU Beds</span>

              <div class="bg-amber-50 border border-amber-200 p-1.5 rounded-lg">
                <span class="block font-black text-amber-700 text-sm">12 Free</span>

    function fillDemoPatient() {
      activePatient.name = 'Ramesh Balasaheb Patil';
      activePatient.age = 58;
      activePatient.gender = 'Male';
      renderScreen();
    }

    function applyPreset(type) {
      if (type === 'hypoxia') {
        document.getElementById('vSpo2').value = '84';
        document.getElementById('vHr').value = '128';
        document.getElementById('vBp').value = '100';
        document.getElementById('vRr').value = '30';
      } else if (type === 'stemi') {
        document.getElementById('vSpo2').value = '91';
        document.getElementById('vHr').value = '118';
        document.getElementById('vBp').value = '175';
        document.getElementById('vRr').value = '24';
      } else {
        document.getElementById('vSpo2').value = '98';
        document.getElementById('vHr').value = '74';
        document.getElementById('vBp').value = '120';
        document.getElementById('vRr').value = '16';
      }
    }

    function calculateTriage() {
      const spo2 = parseFloat(document.getElementById('vSpo2').value);
      const hr = parseInt(document.getElementById('vHr').value);
      
      if (spo2 < 90 || hr > 120) {
        triageResult = {
          urgency: 'EMERGENCY',
          color: '#EF4444',
          recommendation: 'Immediate transfer to Tertiary ICCU via 108 ALS Ambulance.',
          riskFactors: [
            `Critical Hypoxia: SpO₂ is ${spo2}% (< 90%)`,
            `Severe Tachycardia: Heart Rate is ${hr} bpm`,
            'Suspected Acute Coronary Syndrome (ACS)'
          ]
        };
      } else if (spo2 < 95) {
        triageResult = {
          urgency: 'URGENT',
          color: '#D97706',
          recommendation: 'Urgent transfer to Sub-District or District Hospital within 1-2 hours.',
          riskFactors: [`Moderate Hypoxemia: SpO₂ ${spo2}%`]
        };
      } else {
        triageResult = {
          urgency: 'ROUTINE',
          color: '#059669',
          recommendation: 'Standard OPD consultation at Primary Health Centre.',
          riskFactors: ['Vital signs within normal limits.']
        };
      }
      navigate('triage_result');
    }

    function confirmBedAndDispatch() {
      referralStatus = 'BED RESERVED';
      navigate('referrals');
    }

    function advanceTimeline() {
      if (referralStatus === 'BED RESERVED') referralStatus = 'IN TRANSIT';
      else if (referralStatus === 'IN TRANSIT') referralStatus = 'ARRIVED';
      else if (referralStatus === 'ARRIVED') referralStatus = 'COMPLETED';
      renderScreen();
    }

    function completeHandover() {
      referralStatus = 'COMPLETED';
      alert('Patient handover completed! Bed admission active at District Hospital.');
      navigate('referrals');
    }

    function setRole(role) {
      alert(`Switched active profile to ${role}.`);
      navigate('dashboard');
    }

    // Initial boot
    renderScreen();
  </script>
