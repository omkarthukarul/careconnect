name: careconnect_maharashtra
description: "संजीवन महा-नेट - CareConnect Maharashtra: Smart India Hackathon Emergency Triage, Bed Reservation & Referral Coordination System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Networking & REST API
  dio: ^5.4.3+1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Maps & Location (OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
